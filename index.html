<!doctype html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Что оценили гости + спальные места</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="kit/bundles/ok-typography.css">
<style>
  @font-face{font-family:"PT Root UI Web";font-weight:480;src:url(kit/bundles/assets/PT-Root-UI-Web-Medium.4b7fa55b.woff2) format("woff2")}
  @font-face{font-family:"PT Root UI Web";font-weight:500;src:url(kit/bundles/assets/PT-Root-UI-Web-Medium.4b7fa55b.woff2) format("woff2")}
  :root{--palette-black:#2d3137;--palette-dark:#868686;--palette-light:#e5e5e5;--palette-ulight:#f4f4f4;--palette-white:#fff}
  html,body{margin:0}
  body{background:var(--palette-ulight);color:var(--palette-black);font-family:"PT Root UI Web",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px}
  .vp{display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);gap:4px;padding:4px;border-radius:12px;background:var(--palette-light)}
  .vp button{border:0;cursor:pointer;padding:6px 12px;border-radius:8px;background:transparent;color:var(--palette-dark);font:inherit}
  .vp button[aria-pressed="true"]{background:var(--palette-white);color:var(--palette-black)}
  .phone{inline-size:360px;block-size:744px;border-radius:24px;overflow:hidden;background:var(--palette-white);
    box-shadow:0 0 0 1px var(--palette-light),0 8px 32px rgba(45,49,55,.12)}
  .phone iframe{display:block;inline-size:360px;block-size:744px;border:0}
  /* десктоп: фрейм шириной 1440, масштаб под окно (transform), обёртка — под масштабированный размер */
  .desk{border-radius:12px;overflow:hidden;background:#f4f4f4;box-shadow:0 0 0 1px var(--palette-light),0 8px 32px rgba(45,49,55,.12)}
  .desk iframe{display:block;inline-size:1440px;border:0;transform-origin:0 0;background:#f4f4f4}
  .bar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .vp-l{align-self:center;padding:0 4px 0 8px;color:var(--palette-dark)}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="bar">
  <div class="vp" role="toolbar" aria-label="Вьюпорт">
    <button type="button" data-vp="m" class="ok-t-t-m-medium">Мобильная 360</button>
    <button type="button" data-vp="d" class="ok-t-t-m-medium">Десктоп 1440</button>
  </div>
  <div class="vp" role="toolbar" aria-label="Что оценили гости — сколько пунктов">
    <button type="button" data-hn="3" class="ok-t-t-m-medium">3 пункта</button>
    <button type="button" data-hn="2" class="ok-t-t-m-medium">2 пункта</button>
    <button type="button" data-hn="1" class="ok-t-t-m-medium">1 пункт</button>
  </div>
  <div class="vp" role="toolbar" aria-label="Спальные места в «Об апартаментах»">
    <span class="vp-l ok-t-t-m">Спальных мест</span>
    <button type="button" data-bn="1" class="ok-t-t-m-medium">1</button>
    <button type="button" data-bn="2" class="ok-t-t-m-medium">2</button>
    <button type="button" data-bn="3" class="ok-t-t-m-medium">3</button>
    <button type="button" data-bn="4" class="ok-t-t-m-medium">4</button>
    <button type="button" data-bn="5" class="ok-t-t-m-medium">5</button>
  </div>
  </div>
  <div class="phone" id="phw"><iframe id="ph" title="Страница апартаментов, 360px"></iframe></div>
  <div class="desk" id="dkw" hidden><iframe id="dk" title="Страница апартаментов, 1440px"></iframe></div>
<script>
(function () {
  var F = { m: document.getElementById('ph'), d: document.getElementById('dk') };
  var W = { m: document.getElementById('phw'), d: document.getElementById('dkw') };
  var SRC = { m: 'mobile.html', d: 'desktop.html' };
  var btns = document.querySelectorAll('[data-vp]');
  var vp = new URLSearchParams(location.search).get('vp') === 'd' ? 'd' : 'm';
  var started = { m: false, d: false };

  function fit() {
    var top = W.d.getBoundingClientRect().top + window.scrollY;
    var s = Math.max(0.3, Math.min(1, (window.innerWidth - 32) / 1440));
    var h = Math.max(600, Math.round((window.innerHeight - top - 16) / s));
    F.d.style.height = h + 'px'; F.d.style.transform = 'scale(' + s + ')';
    W.d.style.width = Math.round(1440 * s) + 'px'; W.d.style.height = Math.round(h * s) + 'px';
  }
  /* при открытии — к «Об апартаментах» и «Что оценили гости»; высоты над ним меняются после load (шрифты, фото),
     поэтому догоняем несколько раз, пока пользователь сам не начал крутить */
  function toBlock(f) {
    var w = f.contentWindow, d = f.contentDocument, el = d && d.querySelector('.ApartmentPage_about__pRX_s');
    if (!el) return;
    var userScrolled = false;
    ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (ev) { w.addEventListener(ev, function () { userScrolled = true; }, { once: true }); });
    [0, 300, 900, 1800].forEach(function (t) {
      setTimeout(function () {
        if (userScrolled) return;
        w.scrollTo({ top: el.getBoundingClientRect().top + w.scrollY - (f === F.m ? 16 : 120), behavior: 'instant' });
      }, t);
    });
  }
  function show() {
    btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.vp === vp)); });
    W.m.hidden = vp !== 'm'; W.d.hidden = vp !== 'd';
    if (vp === 'd') fit();
    if (!started[vp]) {
      started[vp] = true;
      var f = F[vp];
      f.addEventListener('load', function () { setAb(f); toBlock(f); }, { once: true });
      f.src = SRC[vp];
    }
  }
  btns.forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.dataset.vp === vp) return;
      vp = b.dataset.vp;
      var u = new URL(location.href); u.searchParams.set('vp', vp); history.replaceState(null, '', u);
      show();
    });
  });
  /* зашито при сборке: «Об апартаментах» — вариант 8, «Что оценили гости» — вариант D.
     Переключаются атрибуты html фреймов (guests.css): data-hn — пунктов в «Что оценили гости» (?hn=1…3),
     data-bn — спальных мест в «Об апартаментах» (?bn=1…5) */
  var q = new URLSearchParams(location.search);
  var st = { hn: /^[1-3]$/.test(q.get('hn')) ? q.get('hn') : '3', bn: /^[1-5]$/.test(q.get('bn')) ? q.get('bn') : '2' };
  var sel = { hn: '.ApartmentPage_highlights', bn: '.ApartmentPage_about__pRX_s' };
  function setAb(f) { var d = f.contentDocument; if (d && d.documentElement) { d.documentElement.setAttribute('data-hn', st.hn); d.documentElement.setAttribute('data-bn', st.bn); } }
  function mark(k) { document.querySelectorAll('[data-' + k + ']').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset[k] === st[k])); }); }
  function pick(k, v) {
    if (v === st[k]) return; st[k] = v;
    var u = new URL(location.href); u.searchParams.set(k, v); history.replaceState(null, '', u);
    mark(k); setAb(F.m); setAb(F.d);
    var f = F[vp], w = f.contentWindow, el = f.contentDocument && f.contentDocument.querySelector(sel[k]);  /* блок — в зону видимости */
    if (el) { var r = el.getBoundingClientRect(); if (r.top < 0 || r.bottom > w.innerHeight) w.scrollTo({ top: r.top + w.scrollY - (vp === 'm' ? 16 : 120), behavior: 'instant' }); }
  }
  ['hn', 'bn'].forEach(function (k) {
    mark(k);
    document.querySelectorAll('[data-' + k + ']').forEach(function (b) { b.addEventListener('click', function () { pick(k, b.dataset[k]); }); });
  });
  window.addEventListener('resize', function () { if (vp === 'd') fit(); });
  show();
})();
</script>
</body>
</html>
